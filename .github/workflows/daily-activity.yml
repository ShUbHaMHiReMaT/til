name: daily-activity

on:
  schedule:
    # 03:30 UTC == 09:00 IST. Actions cron runs late under load, sometimes 30+ min.
    - cron: "30 3 * * *"
  workflow_dispatch:

# Prevents two runs colliding on the same daily/<date> branch.
concurrency:
  group: daily-activity
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT, not GITHUB_TOKEN — bot-authored commits do not count on your graph.
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "${{ vars.GIT_NAME }}"
          git config user.email "${{ vars.GIT_EMAIL }}"

      - name: Create branch and commits
        run: |
          set -euo pipefail
          COUNT=10
          DATE="$(date -u +%F)"
          BRANCH="daily/${DATE}"
          echo "DATE=${DATE}"     >> "$GITHUB_ENV"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          echo "COUNT=${COUNT}"   >> "$GITHUB_ENV"

          # If you already ran the manual script today, the branch exists remotely.
          # Bail out cleanly rather than failing the run.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists on remote. Nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi

          git checkout -b "${BRANCH}"

          mkdir -p log
          FILE="log/$(date -u +%Y-%m).md"

          for i in $(seq 1 "${COUNT}"); do
            # ---- PAYLOAD: swap for something that writes real content ----
            printf -- "- %s — entry %02d\n" \
              "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" "${i}" >> "${FILE}"
            # --------------------------------------------------------------
            git add -A
            git commit -m "chore: log ${DATE} (${i}/${COUNT})" --quiet
          done

          git push origin "${BRANCH}"

      - name: Open PR and merge it
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${BRANCH}" \
            --title "Daily log ${DATE}" \
            --body "Automated entries for ${DATE}."

          # --rebase replays all 10 commits onto the default branch individually.
          # --squash would collapse them to one and you'd be back to a single commit.
          gh pr merge "${BRANCH}" --rebase --delete-branch
