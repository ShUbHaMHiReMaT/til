name: daily-activity

on:
  schedule:
    # 03:30 UTC == 09:00 IST. Cron in Actions is often delayed 5-30 min. That's normal.
    - cron: "30 3 * * *"
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT (not GITHUB_TOKEN) so the commit + PR are attributed to YOU,
          # not to github-actions[bot]. Bot activity does not count on your graph.
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "${{ vars.GIT_NAME }}"
          git config user.email "${{ vars.GIT_EMAIL }}"

      - name: Create branch and commit
        id: work
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          BRANCH="daily/${DATE}"
          echo "DATE=${DATE}"     >> "$GITHUB_ENV"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"

          git checkout -b "${BRANCH}"

          # ---- THE PAYLOAD ----------------------------------------------
          # Replace this block with something that writes real content.
          # Right now it appends a dated line to a monthly log file.
          mkdir -p log
          FILE="log/$(date -u +%Y-%m).md"
          printf -- "- %s — automated entry\n" "$(date -u +'%Y-%m-%d %H:%M UTC')" >> "${FILE}"
          # ---------------------------------------------------------------

          git add -A
          git commit -m "chore: daily log ${DATE}"
          git push origin "${BRANCH}"

      - name: Open PR and merge it
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${BRANCH}" \
            --title "Daily log ${DATE}" \
            --body "Automated daily entry for ${DATE}."

          # Squash-merge onto the default branch. Commits only count toward the
          # contribution graph once they land on the default branch.
          gh pr merge "${BRANCH}" --squash --delete-branch
